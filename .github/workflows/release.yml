name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: read

jobs:
  deploy:
    uses: josh803316/shared-ci-workflows/.github/workflows/vercel-production.yml@main
    with:
      app-name: lll-experience
      vercel-project-id: ${{ vars.VERCEL_PROJECT_ID }}
      vercel-org-id: ${{ vars.VERCEL_ORG_ID }}
      build-command: 'bun run build'
    secrets: inherit

  smoke:
    name: Smoke
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.BUN_AUTH_TOKEN }}

      - name: Install Playwright Chromium
        run: bunx playwright install chromium --with-deps

      - name: Smoke production
        run: bun run test:smoke
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

  release:
    name: Release
    needs: [deploy, smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      # semantic-release requires Node >=22.14.0 (Bun reports ~v20 for process.version)
      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      # Install release tooling — not in package.json to avoid Vercel needing GitHub Packages auth
      # GITHUB_TOKEN must be set here so Bun can expand ${GITHUB_TOKEN} in .npmrc
      - name: Install release dependencies
        run: bun add @josh803316/semantic-release-helper semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.BUN_AUTH_TOKEN }}

      - name: Release
        run: bunx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.BUN_AUTH_TOKEN }}
          SEMANTIC_RELEASE_PACKAGE: lll-experience
