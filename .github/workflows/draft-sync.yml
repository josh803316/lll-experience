name: Keep Alive

on:
  # Twice weekly (Sun + Wed at noon UTC / 8 AM ET) — keeps Supabase DB from
  # pausing. Supabase pauses free projects after 7 days of inactivity, and
  # GitHub Actions cron is best-effort, so two runs/week gives headroom if
  # one is skipped.
  schedule:
    - cron: '0 12 * * 0,3'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping health endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::SITE_URL or CRON_SECRET secret is not set"
            exit 1
          fi
          SITE_URL="${SITE_URL%/}"
          echo "=== Keep-alive ping at $(date -u) ==="
          # Hit health check (wakes up the serverless function + DB connection)
          curl -fsS --max-time 30 "$SITE_URL/health"
          echo
          # Hit the cron endpoint to trigger a DB query
          if ! STATUS=$(curl -sS -o /tmp/response.json -w "%{http_code}" --max-time 60 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$SITE_URL/api/cron/sync-draft-picks"); then
            echo "::error::Cron request failed"
            exit 1
          fi
          echo "HTTP $STATUS"
          cat /tmp/response.json
          echo
          if [ "$STATUS" != "200" ]; then
            echo "::error::Cron endpoint returned HTTP $STATUS"
            exit 1
          fi
