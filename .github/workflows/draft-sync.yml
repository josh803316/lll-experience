name: Keep Alive

on:
  # Daily at noon UTC — keeps Supabase free-tier DB from pausing after 7 days
  # of inactivity. GitHub Actions cron is best-effort (can skip), so daily
  # gives plenty of headroom vs twice-weekly.
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping health + DB keep-alive
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::SITE_URL or CRON_SECRET secret is not set"
            exit 1
          fi
          SITE_URL="${SITE_URL%/}"
          echo "=== Keep-alive ping at $(date -u) ==="

          # Wake the serverless function
          curl -fsS --max-time 30 "$SITE_URL/health"
          echo

          # Explicit DB SELECT so Supabase registers activity even post-draft
          if ! STATUS=$(curl -sS -o /tmp/response.json -w "%{http_code}" --max-time 60 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$SITE_URL/api/cron/keepalive"); then
            echo "::error::Keep-alive request failed"
            exit 1
          fi
          echo "HTTP $STATUS"
          cat /tmp/response.json
          echo
          if [ "$STATUS" != "200" ]; then
            echo "::error::Keep-alive endpoint returned HTTP $STATUS"
            exit 1
          fi
